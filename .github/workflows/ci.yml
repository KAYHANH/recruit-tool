name: Candidate Finder & CV Outreach CI

on:
  push:
    branches: [ main, "fix/**", "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f candidate_sourcing_tool/requirements.txt ]; then
            pip install -r candidate_sourcing_tool/requirements.txt
          fi
          pip install pytest pytest-asyncio

      - name: Run Backend Regression Test Suite
        working-directory: candidate_sourcing_tool
        run: |
          python -m pytest tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: candidate_sourcing_tool/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: candidate_sourcing_tool/frontend
        run: |
          npm ci || npm install

      - name: Build Frontend (TypeScript & Vite)
        working-directory: candidate_sourcing_tool/frontend
        run: |
          npm run build

      - name: Verify No Sensitive Files or Secrets Committed
        run: |
          echo "Scanning for sensitive files..."
          if git ls-files | grep -E '(\.env|\.pem|\.key|credentials\.json|token\.json|\.sqlite|\.db)$'; then
            echo "ERROR: Sensitive secrets or database files detected in tracked repository files!"
            exit 1
          fi
          echo "No sensitive secrets detected."
